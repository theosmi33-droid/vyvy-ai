name: Tests

# The unit tests of tools/, training/ and runner/ (no model, no GPU, no secrets).
on:
  push:
    branches: [main]
    paths: ["tools/**", "training/**", "runner/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          set -euo pipefail
          pip install -q pytest==8.3.3
          python -m pytest -q tests
