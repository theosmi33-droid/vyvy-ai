name: Bench LoRA

# Measures a trained adapter against the current default in one job on the same
# runner (same CPU, same prompt, route mode). Acceptance is decided only on
# blind holdout v2 (data/holdout_blind_v2.json, 30 questions per intent, written
# without knowledge of any errors) by a statistical rule (tools/compare_adapter.py:
# exact McNemar p < 0.05, b >= 2c, per-intent tolerance, no loss on "unknown");
# blind holdout v1 and the development holdout are reported for information. The
# shadow holdout v3 can only veto (tools/shadow_check.py): an adapter significantly
# worse there is rejected, and after 8 decisions on v2 an issue asks for rotation. The default is the newest accepted
# adapter for the same base model and prompt, or the base model alone if there is
# none. The candidate release becomes a regular release (the new default) only
# with zero regressions and a higher intent accuracy; otherwise it stays a
# pre-release marked rejected, with the report and the missed questions attached.
# Started by the Train workflow, or by hand with a release tag.
on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Release tag of the adapter, e.g. vyvy-1.5b-d1234abcd
        type: string
        required: true

permissions:
  contents: write      # mark the release accepted or rejected
  issues: write        # holdout rotation notice
  id-token: write      # sign adapter_manifest.json (build provenance)
  attestations: write

concurrency:
  group: bench-lora-${{ inputs.adapter }}
  cancel-in-progress: false

jobs:
  bench-lora:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ADAPTER: ${{ inputs.adapter }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch the adapter and check it fits this benchmark
        id: adapter
        run: |
          set -euo pipefail
          [[ "$ADAPTER" =~ ^[a-z0-9][a-z0-9.-]{0,60}$ ]] || { echo "invalid tag" >&2; exit 1; }
          gh release download "$ADAPTER" --repo "$GITHUB_REPOSITORY" --pattern '*.gguf' --pattern manifest.json --dir adapter
          python - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "runner")
          import bench
          name = os.environ["ADAPTER"]
          m = json.load(open("adapter/manifest.json"))
          gguf = f"adapter/{name}.gguf"
          assert m["adapter"] == f"{name}.gguf", m["adapter"]
          assert m["adapter_sha256"] == hashlib.sha256(open(gguf, "rb").read()).hexdigest(), "checksum"
          models = {"Qwen/Qwen2.5-1.5B-Instruct": ("Qwen/Qwen2.5-1.5B-Instruct-GGUF", "qwen2.5-1.5b-instruct-q8_0"),
                    "Qwen/Qwen2.5-7B-Instruct": ("Qwen/Qwen2.5-7B-Instruct-GGUF", "qwen2.5-7b-instruct-q4_k_m")}
          repo, model = models[m["base"]]
          prompt = bench.prompt_for(m["base"])
          current = hashlib.sha256(bench.PROMPTS[prompt].encode("utf-8")).hexdigest()
          if m.get("prompt") != prompt or m.get("prompt_sha256") != current:
              sys.exit(f"adapter was trained on prompt {m.get('prompt')} ({m.get('prompt_sha256', '')[:12]}), "
                       f"the benchmark now uses {prompt} ({current[:12]}); retrain before measuring")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\nmodel={model}\ngguf={gguf}\nbase={m['base']}\nprompt_sha={current}\n")
          PY

      - name: Find the current default adapter (the baseline to beat)
        id: baseline
        env:
          BASE: ${{ steps.adapter.outputs.base }}
          PROMPT_SHA: ${{ steps.adapter.outputs.prompt_sha }}
        run: |
          set -euo pipefail
          prev=$(python tools/previous_adapter.py --repo "$GITHUB_REPOSITORY" --base "$BASE" \
                   --prompt-sha256 "$PROMPT_SHA" --exclude "$ADAPTER")
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern "$prev.gguf" --dir baseline
            echo "gguf=baseline/$prev.gguf" >> "$GITHUB_OUTPUT"
            echo "Baseline: accepted adapter \`$prev\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Baseline: base model without adapter (no accepted adapter yet)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "name=${prev:-base model}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (CPU build)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: model-${{ steps.adapter.outputs.model }}

      # Fixed Hugging Face commit and SHA-256 per file (models.json).
      - name: Download the base model
        env:
          # Only used if Hugging Face fails: private Kaggle mirror (mirror.yml).
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          MODEL: ${{ steps.adapter.outputs.model }}
        run: python tools/fetch_model.py "$MODEL" --dir models

      - name: Baseline and candidate on blind holdout v2 (decides), v1 and the development holdout (information)
        env:
          MODEL: ${{ steps.adapter.outputs.model }}
          GGUF: ${{ steps.adapter.outputs.gguf }}
          BASELINE_GGUF: ${{ steps.baseline.outputs.gguf }}
        run: |
          set -euo pipefail
          file=$(ls models/"$MODEL"*.gguf | sort | head -n 1)
          run() {  # $1 = data set, $2 = output prefix, $3 = adapter or empty
            VYVY_LORA_PATH="$3" python runner/bench.py --model "$file" --label "$MODEL" --mode route \
              --data "$1" --threads "$(nproc)" --summary "$GITHUB_STEP_SUMMARY" --json "$2.json"
          }
          echo "## Blind holdout v2, 30 per intent (decides acceptance)" >> "$GITHUB_STEP_SUMMARY"
          run data/holdout_blind_v2.json base_blind "$BASELINE_GGUF"
          run data/holdout_blind_v2.json lora_blind "$GGUF"
          echo "## Blind holdout v1 (information only)" >> "$GITHUB_STEP_SUMMARY"
          run data/holdout_blind_v1.json base_v1 "$BASELINE_GGUF"
          run data/holdout_blind_v1.json lora_v1 "$GGUF"
          echo "## Development holdout (information only)" >> "$GITHUB_STEP_SUMMARY"
          run data/holdout_benchmarks.json base_dev "$BASELINE_GGUF"
          run data/holdout_benchmarks.json lora_dev "$GGUF"
          echo "## Shadow holdout v3 (can only veto)" >> "$GITHUB_STEP_SUMMARY"
          run data/holdout_blind_v3.json base_shadow "$BASELINE_GGUF"
          run data/holdout_blind_v3.json lora_shadow "$GGUF"

      - name: Decide
        id: decide
        env:
          BASELINE_NAME: ${{ steps.baseline.outputs.name }}
        run: |
          set -uo pipefail
          python tools/compare_adapter.py base_dev.json lora_dev.json --name "$ADAPTER (development holdout)" \
            --baseline-name "$BASELINE_NAME" | tee -a "$GITHUB_STEP_SUMMARY" || true
          python tools/compare_adapter.py base_v1.json lora_v1.json --name "$ADAPTER (blind holdout v1)" \
            --baseline-name "$BASELINE_NAME" | tee -a "$GITHUB_STEP_SUMMARY" || true
          python tools/compare_adapter.py base_blind.json lora_blind.json --name "$ADAPTER (blind holdout v2)" \
            --baseline-name "$BASELINE_NAME" --verdict verdict.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          [ "$code" -le 1 ] || exit "$code"
          # Decisions already measured on the active holdout: every release that is no longer a candidate.
          decisions=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,name \
            --jq "[.[] | select(.tagName != \"$ADAPTER\") | select(.name | endswith(\"(candidate)\") | not)] | length")
          python tools/shadow_check.py base_shadow.json lora_shadow.json --verdict verdict.json \
            --decisions "$decisions" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          [ "$code" -le 1 ] || exit "$code"
          echo "accepted=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if python -c "import json,sys; sys.exit(0 if json.load(open('verdict.json'))['rotation_due'] else 1)"; then
            title="Holdout rotation due (blind v2 used for $((decisions + 1)) decisions)"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Holdout rotation due in:title" \
                 --json title --jq '.[].title' | grep -q "Holdout rotation due"; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "Blind holdout v2 has decided $((decisions + 1)) adapters. Replace it: v3 (shadow) becomes the active set, a newly written blind set becomes the shadow, and v2 may go into the training data. Opened by bench-lora."
            fi
          fi

      - name: Mark the release
        env:
          ACCEPTED: ${{ steps.decide.outputs.accepted }}
          MODEL: ${{ steps.adapter.outputs.model }}
        run: |
          set -euo pipefail
          reason=$(python -c "import json; print(json.load(open('verdict.json'))['reason'])")
          gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n\nbench-lora (run %s): %s, %s.\n' "$GITHUB_RUN_ID" \
            "$([ "$ACCEPTED" = true ] && echo accepted || echo rejected)" "$reason" >> notes.md
          if [ "$ACCEPTED" = true ]; then
            gh release edit "$ADAPTER" --repo "$GITHUB_REPOSITORY" --prerelease=false --title "$ADAPTER" --notes-file notes.md
          else
            gh release edit "$ADAPTER" --repo "$GITHUB_REPOSITORY" --title "$ADAPTER (rejected)" --notes-file notes.md
          fi
          python tools/release_manifest.py adapter/manifest.json verdict.json \
            --gguf-key "$MODEL" --run-id "$GITHUB_RUN_ID" --out adapter_manifest.json
          gh release upload "$ADAPTER" verdict.json adapter_manifest.json base_blind.json lora_blind.json \
            base_v1.json lora_v1.json base_dev.json lora_dev.json base_shadow.json lora_shadow.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      # Signs which run of this repository measured exactly this adapter file and manifest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            adapter_manifest.json
            ${{ steps.adapter.outputs.gguf }}

      - name: Fail when rejected
        if: steps.decide.outputs.accepted != 'true'
        run: |
          echo "Adapter rejected; see the summary." >&2
          exit 1
