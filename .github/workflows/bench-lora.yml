name: Bench LoRA

# Measures a trained adapter against the current default on output contract 2 (25 intents).
# The decision set (DECISION_SET, 40 questions per intent plus 160 unknown, about 1 120) and
# the shadow set (SHADOW_SET, 20 per intent plus 80 unknown) run in parts on parallel runners
# (matrix): a 7B run over the whole decision set takes about 2 x 50 min, too close to one
# job's limit. Baseline and candidate of a part always run on the same runner (same CPU,
# same prompt, route mode); tools/merge_results.py joins the parts and refuses parts that
# do not belong together (other baseline, other grammar, a part missing or twice).
# Acceptance is decided only on the decision set by a statistical rule
# (tools/compare_adapter.py: exact McNemar p < 0.05, b >= 2c, an intent fails only above its
# tolerance and binomially noticeable, no loss on "unknown"). The shadow set can only veto
# (tools/shadow_check.py), and after 8 decisions an issue asks for rotation. The contract 1
# holdouts (blind v1, v3, v4, development) are no longer measured: their labels follow the
# 9 intents of contract 1. The default is the newest accepted adapter for the same base model
# and prompt, or the base model alone if there is none. An adapter trained for another
# contract or grammar is refused before anything is measured.
# Started by the Train workflow, or by hand with a release tag.
on:
  workflow_dispatch:
    inputs:
      adapter:
        description: Release tag of the adapter, e.g. vyvy-1.5b-d1234abcd
        type: string
        required: true
      remeasure:
        description: "Measure an accepted release that has no signature yet: never changes its title, status or notes, never replaces a file"
        type: boolean
        default: false

permissions:
  contents: write      # mark the release accepted or rejected
  issues: write        # holdout rotation notice
  id-token: write      # sign adapter_manifest.json (build provenance)
  attestations: write
  actions: write       # start Catalog after runs the pipeline started itself

concurrency:
  group: bench-lora-${{ inputs.adapter }}
  cancel-in-progress: false

env:
  DECISION_SET: data/holdout_decision_c2.json
  SHADOW_SET: data/holdout_shadow_c2.json

jobs:
  measure:
    runs-on: ubuntu-latest
    environment: kaggle  # model mirror fallback; Kaggle secrets only exist here (main only)
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - {set: decision, part: 1, parts: 4}
          - {set: decision, part: 2, parts: 4}
          - {set: decision, part: 3, parts: 4}
          - {set: decision, part: 4, parts: 4}
          - {set: shadow, part: 1, parts: 2}
          - {set: shadow, part: 2, parts: 2}
    outputs:
      model: ${{ steps.adapter.outputs.model }}
      baseline: ${{ steps.baseline.outputs.name }}
    env:
      ADAPTER: ${{ inputs.adapter }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Fetch the adapter and check it fits this benchmark
        id: adapter
        run: |
          set -euo pipefail
          [[ "$ADAPTER" =~ ^[a-z0-9][a-z0-9.-]{0,60}$ ]] || { echo "invalid tag" >&2; exit 1; }
          gh release download "$ADAPTER" --repo "$GITHUB_REPOSITORY" --pattern '*.gguf' --pattern manifest.json --dir adapter
          python - <<'PY'
          import hashlib, json, os, sys
          sys.path.insert(0, "runner")
          import bench
          name = os.environ["ADAPTER"]
          m = json.load(open("adapter/manifest.json"))
          gguf = f"adapter/{name}.gguf"
          assert m["adapter"] == f"{name}.gguf", m["adapter"]
          assert m["adapter_sha256"] == hashlib.sha256(open(gguf, "rb").read()).hexdigest(), "checksum"
          # 1.5B is measured in Q4_K_M until bench-client has compared Q4_K_M with Q8_0 (decision of 23.11.2026).
          models = {"Qwen/Qwen2.5-1.5B-Instruct": ("Qwen/Qwen2.5-1.5B-Instruct-GGUF", "qwen2.5-1.5b-instruct-q4_k_m"),
                    "Qwen/Qwen2.5-7B-Instruct": ("Qwen/Qwen2.5-7B-Instruct-GGUF", "qwen2.5-7b-instruct-q4_k_m")}
          repo, model = models[m["base"]]
          grammar = hashlib.sha256(bench.DEFAULT_GRAMMAR.read_bytes()).hexdigest()
          if m.get("contract_version", 1) != bench.CONTRACT_VERSION or m.get("grammar_sha256") != grammar:
              sys.exit(f"adapter was trained for contract {m.get('contract_version', 1)} "
                       f"(grammar {str(m.get('grammar_sha256'))[:12]}), the benchmark measures contract "
                       f"{bench.CONTRACT_VERSION} ({grammar[:12]}); retrain before measuring")
          prompt = bench.prompt_for(m["base"])
          current = hashlib.sha256(bench.PROMPTS[prompt].encode("utf-8")).hexdigest()
          if m.get("prompt") != prompt or m.get("prompt_sha256") != current:
              sys.exit(f"adapter was trained on prompt {m.get('prompt')} ({m.get('prompt_sha256', '')[:12]}), "
                       f"the benchmark now uses {prompt} ({current[:12]}); retrain before measuring")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\nmodel={model}\ngguf={gguf}\nbase={m['base']}\nprompt_sha={current}\n")
          PY

      - name: Find the current default adapter (the baseline to beat)
        id: baseline
        env:
          BASE: ${{ steps.adapter.outputs.base }}
          PROMPT_SHA: ${{ steps.adapter.outputs.prompt_sha }}
        run: |
          set -euo pipefail
          prev=$(python tools/previous_adapter.py --repo "$GITHUB_REPOSITORY" --base "$BASE" \
                   --prompt-sha256 "$PROMPT_SHA" --exclude "$ADAPTER")
          if [ -n "$prev" ]; then
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern "$prev.gguf" --dir baseline
            echo "gguf=baseline/$prev.gguf" >> "$GITHUB_OUTPUT"
            echo "Baseline: accepted adapter \`$prev\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Baseline: base model without adapter (no accepted adapter yet)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "name=${prev:-base model}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (CPU build)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: model-${{ steps.adapter.outputs.model }}

      # Fixed Hugging Face commit and SHA-256 per file (models.json).
      - name: Download the base model
        env:
          # Only used if Hugging Face fails: private Kaggle mirror (mirror.yml).
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          MODEL: ${{ steps.adapter.outputs.model }}
        run: python tools/fetch_model.py "$MODEL" --dir models

      - name: Baseline and candidate on this part
        env:
          MODEL: ${{ steps.adapter.outputs.model }}
          GGUF: ${{ steps.adapter.outputs.gguf }}
          BASELINE_GGUF: ${{ steps.baseline.outputs.gguf }}
          SET: ${{ matrix.set }}
          PART: ${{ matrix.part }}
          PARTS: ${{ matrix.parts }}
        run: |
          set -euo pipefail
          file=$(ls models/"$MODEL"*.gguf | sort | head -n 1)
          case "$SET" in
            decision) data="$DECISION_SET" ;;
            shadow) data="$SHADOW_SET" ;;
          esac
          [ -f "$data" ] || { echo "$data is missing; the $SET set has not landed yet" >&2; exit 1; }
          run() {  # $1 = output prefix, $2 = adapter or empty
            VYVY_LORA_PATH="$2" python runner/bench.py --model "$file" --label "$MODEL" --mode route \
              --data "$data" --part "$PART/$PARTS" --threads "$(nproc)" --summary "$GITHUB_STEP_SUMMARY" \
              --json "results/$1_${SET}_p$PART.json"
          }
          mkdir -p results
          echo "## ${SET} set, part $PART of $PARTS" >> "$GITHUB_STEP_SUMMARY"
          run base "$BASELINE_GGUF"
          run lora "$GGUF"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ matrix.set }}-${{ matrix.part }}
          path: results/*.json
          retention-days: 30

  decide:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ADAPTER: ${{ inputs.adapter }}
      GH_TOKEN: ${{ github.token }}
      # When the contract 2 decision set landed; decisions before it do not count toward its rotation.
      # Set in the commit that adds the set; until then the Decide step refuses to run.
      ACTIVE_SINCE: "SET-WHEN-THE-DECISION-SET-LANDS"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          merge-multiple: true

      - name: Fetch the adapter again (signed with the manifest)
        id: adapter
        run: |
          set -euo pipefail
          gh release download "$ADAPTER" --repo "$GITHUB_REPOSITORY" --pattern "$ADAPTER.gguf" --pattern manifest.json --dir adapter
          echo "gguf=adapter/$ADAPTER.gguf" >> "$GITHUB_OUTPUT"
          echo "model=${{ needs.measure.outputs.model }}" >> "$GITHUB_OUTPUT"

      - name: Join the parts
        run: |
          set -euo pipefail
          for side in base lora; do
            for set in decision shadow; do
              python tools/merge_results.py "${side}_${set}"_p*.json --out "${side}_${set}.json"
            done
          done

      - name: Decide
        id: decide
        env:
          BASELINE_NAME: ${{ needs.measure.outputs.baseline }}
        run: |
          # GitHub runs steps with bash -e; a rejection (exit 1) must not end the step
          # before the shadow check and the marking of the release.
          set +e
          set -uo pipefail
          [[ "$ACTIVE_SINCE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}T ]] || { echo "ACTIVE_SINCE is not set" >&2; exit 2; }
          python tools/compare_adapter.py base_decision.json lora_decision.json --name "$ADAPTER (decision set)" \
            --baseline-name "$BASELINE_NAME" --verdict verdict.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          [ "$code" -le 1 ] || exit "$code"
          # Decisions already measured on the active decision set (since ACTIVE_SINCE): every release
          # created after it that is no longer a candidate.
          decisions=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,name,createdAt \
            --jq "[.[] | select(.tagName != \"$ADAPTER\") | select(.createdAt > \"$ACTIVE_SINCE\") | select(.name | endswith(\"(candidate)\") | not)] | length")
          python tools/shadow_check.py base_shadow.json lora_shadow.json --verdict verdict.json \
            --decisions "$decisions" | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          [ "$code" -le 1 ] || exit "$code"
          echo "accepted=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if python -c "import json,sys; sys.exit(0 if json.load(open('verdict.json'))['rotation_due'] else 1)"; then
            # Only a notice for this set counts: an open one for an older holdout must not hide it.
            prefix="Holdout rotation due (decision set c2 "
            title="${prefix}used for $((decisions + 1)) decisions)"
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$prefix\" in:title" \
                 --json title --jq '.[].title' | grep -qF "$prefix"; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
                "The contract 2 decision set has decided $((decisions + 1)) adapters. Replace it: the shadow set becomes the decision set, a newly built set becomes the shadow, and the old decision set may go into the training data after the relabelling check. Opened by bench-lora."
            fi
          fi

      - name: Mark the release
        if: ${{ !inputs.remeasure }}
        env:
          ACCEPTED: ${{ steps.decide.outputs.accepted }}
          MODEL: ${{ steps.adapter.outputs.model }}
        run: |
          set -euo pipefail
          reason=$(python -c "import json; print(json.load(open('verdict.json'))['reason'])")
          gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n\nbench-lora (run %s): %s, %s.\n' "$GITHUB_RUN_ID" \
            "$([ "$ACCEPTED" = true ] && echo accepted || echo rejected)" "$reason" >> notes.md
          if [ "$ACCEPTED" = true ]; then
            gh release edit "$ADAPTER" --repo "$GITHUB_REPOSITORY" --prerelease=false --title "$ADAPTER" --notes-file notes.md
          else
            gh release edit "$ADAPTER" --repo "$GITHUB_REPOSITORY" --title "$ADAPTER (rejected)" --notes-file notes.md
          fi
          python tools/release_manifest.py adapter/manifest.json verdict.json \
            --gguf-key "$MODEL" --run-id "$GITHUB_RUN_ID" --holdout "$DECISION_SET" --out adapter_manifest.json
          gh release upload "$ADAPTER" verdict.json adapter_manifest.json base_decision.json lora_decision.json \
            base_shadow.json lora_shadow.json --repo "$GITHUB_REPOSITORY" --clobber

      # A remeasurement of a decided release (input remeasure): the release stays as it is - title,
      # status and notes unchanged, no file replaced. The results are added under a dated name;
      # only when accepted does adapter_manifest.json come too, and only if the release has none.
      - name: Record the remeasurement
        if: ${{ inputs.remeasure }}
        env:
          ACCEPTED: ${{ steps.decide.outputs.accepted }}
          MODEL: ${{ steps.adapter.outputs.model }}
        run: |
          set -euo pipefail
          title=$(gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          # Accepted releases only: a rejected one measured again on the decision set would be a second try at the same
          # holdout, and a signed "accepted" must never sit next to a "(rejected)" title.
          [ "$title" = "$ADAPTER" ] || { echo "remeasure is for accepted releases only; title is '$title'" >&2; exit 1; }
          assets=$(gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          day=$(date -u +%F)
          prefix="remeasure-$day"
          if grep -q "^$prefix" <<<"$assets"; then echo "a remeasurement of $day is already attached" >&2; exit 1; fi
          files=()
          for f in verdict.json base_decision.json lora_decision.json base_shadow.json lora_shadow.json; do
            cp "$f" "${prefix}_$f"
            files+=("${prefix}_$f")
          done
          if [ "$ACCEPTED" = true ]; then
            if grep -qx adapter_manifest.json <<<"$assets"; then
              echo "adapter_manifest.json is already attached; a remeasurement never replaces it" >&2; exit 1
            fi
            created=$(gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json createdAt --jq .createdAt)
            first=$(gh release view "$ADAPTER" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
                      | grep -o 'bench-lora (run [0-9]*): [a-z]*' | head -n 1 || true)
            python tools/release_manifest.py adapter/manifest.json verdict.json \
              --gguf-key "$MODEL" --run-id "$GITHUB_RUN_ID" --holdout "$DECISION_SET" --out adapter_manifest.json \
              --remeasured-on "$day" --first-decision "released $created; $first"
            files+=(adapter_manifest.json)
          fi
          gh release upload "$ADAPTER" "${files[@]}" --repo "$GITHUB_REPOSITORY"
          echo "Remeasurement of $ADAPTER attached as ${prefix}_*; the release itself is unchanged." >> "$GITHUB_STEP_SUMMARY"

      # Signs which run of this repository measured exactly this adapter file and manifest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.remeasure || steps.decide.outputs.accepted == 'true' }}
        with:
          subject-path: |
            adapter_manifest.json
            ${{ steps.adapter.outputs.gguf }}

      # Watch cannot report this run when the pipeline started it (runs started with
      # GITHUB_TOKEN start no workflow_run, issue #5), so bench-lora opens the notice itself.
      # Same title as Watch's, whose duplicate check then skips it for runs started by hand.
      - name: Open the rejection notice
        if: steps.decide.outputs.accepted != 'true' && !inputs.remeasure
        run: |
          set -euo pipefail
          title="Adapter rejected: Bench LoRA (run $GITHUB_RUN_ID)"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json title \
               --jq '.[].title' | grep -qxF "$title"; then exit 0; fi
          reason=$(python -c "import json; print(json.load(open('verdict.json'))['reason'])")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body \
            "\`$ADAPTER\` was rejected: $reason. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Opened by bench-lora; it stays open as a decision to read."

      - name: Open the remeasurement notice
        if: steps.decide.outputs.accepted != 'true' && inputs.remeasure
        run: |
          set -euo pipefail
          reason=$(python -c "import json; print(json.load(open('verdict.json'))['reason'])")
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Remeasure rejected: $ADAPTER (run $GITHUB_RUN_ID)" --body \
            "\`$ADAPTER\` did not pass today's rule when measured again: $reason. The release is unchanged and stays unsigned. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Opened by bench-lora."

      # Catalog follows Bench LoRA through workflow_run, which GitHub does not fire for a run
      # started with GITHUB_TOKEN (Collect, Train; issue #5): vyvy-7b-d8c7e19e3 was accepted on
      # 22.11.2026 and never reached catalog.json. A dispatch it does keep. A run started by hand
      # still reaches Catalog through workflow_run, so it is not started twice.
      - name: Refresh the catalog
        if: ${{ !cancelled() && github.actor == 'github-actions[bot]' }}
        run: gh workflow run catalog.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail when rejected
        if: steps.decide.outputs.accepted != 'true'
        run: |
          echo "Adapter rejected; see the summary." >&2
          exit 1
