name: Train

# Starts one LoRA training run on a Kaggle GPU and ends; the Collect workflow
# picks up the result (convert, license files, candidate release, bench-lora)
# because a sweep can run far longer than a GitHub job may wait.
#
# Each run is a sweep: several LoRA ranks and learning rates are trained one
# after the other within a time budget (1.5B: 4 h, 7B: 6 h); the config with the
# best validation accuracy is exported. The blind holdout is not touched here.
#
# Runs without manual approval: a push to main that changes the training data,
# the training code or this workflow starts 1.5B; Collect starts 7B once 1.5B is
# collected. It can also be started by hand for one base model. Adapters are
# named vyvy-<size>-d<hash of data, prompt, trainer and sweep>; an existing name
# is skipped. No run starts while another kernel of the account is running.
# The job runs in the environment "kaggle"; needs KAGGLE_API_TOKEN and KAGGLE_USERNAME.
on:
  push:
    branches: [main]
    paths: ["data/train/**", "training/**", "tools/kaggle_job.py", "tools/plan_train.py", ".github/workflows/train.yml"]
  workflow_dispatch:
    inputs:
      base:
        description: Base model
        type: choice
        default: Qwen/Qwen2.5-1.5B-Instruct
        options:
          - Qwen/Qwen2.5-1.5B-Instruct
          - Qwen/Qwen2.5-7B-Instruct
      name:
        description: Adapter name and release tag (empty = derived from data, prompt and trainer)
        type: string
        required: false
      epochs:
        description: Upper limit of epochs per config (early stopping usually ends sooner)
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: kaggle
    env:
      BASE: ${{ inputs.base || 'Qwen/Qwen2.5-1.5B-Instruct' }}
      NAME_INPUT: ${{ inputs.name }}
      EPOCHS: ${{ inputs.epochs || 4 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Plan (size, sweep, budget, name)
        run: |
          set -euo pipefail
          plan=$(python tools/plan_train.py "$BASE" --epochs "$EPOCHS" --repo "$GITHUB_REPOSITORY")
          get() { echo "$plan" | python -c "import json,sys; v=json.load(sys.stdin).get('$1'); print('' if v is None else v)"; }
          budget=$(get budget); sweep=$(get sweep); batch=$(get batch); accum=$(get grad_accum); trained=$(get trained)
          name=${NAME_INPUT:-$(get name)}
          [[ "$name" =~ ^[a-z0-9][a-z0-9.-]{0,60}$ ]] || { echo "invalid name" >&2; exit 1; }
          if gh release view "$name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Adapter $name already exists; nothing to train." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$NAME_INPUT" ] && [ -n "$trained" ]; then
            # Same training data and prompt as an existing release: trainer fixes alone do not retrain.
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "Already trained on this data and prompt: $trained." >> "$GITHUB_STEP_SUMMARY"
          fi
          ls data/train/*.jsonl >/dev/null 2>&1 || { echo "no training data in data/train/" >&2; exit 1; }
          { echo "NAME=$name"; echo "SWEEP=$sweep"; echo "BUDGET=$budget"; echo "BATCH=$batch"; echo "ACCUM=$accum"; } >> "$GITHUB_ENV"
          echo "Adapter: $name · sweep $sweep · budget $budget min · batch $batch x $accum" >> "$GITHUB_STEP_SUMMARY"

      - name: Holdout lock
        if: env.SKIP != 'true'
        run: python tools/check_holdout_leak.py

      - name: Kaggle quota and free GPU
        if: env.SKIP != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_EXTERNAL_GPU_MIN: ${{ vars.KAGGLE_EXTERNAL_GPU_MIN }}
        # Starts only if the whole budget plus 2 h reserve is left this week and no
        # other kernel of the account (also another project's) is running.
        run: |
          set -euo pipefail
          # kaggle 2.2.5 imports six without declaring it as a dependency
          pip install -q kaggle==2.2.5 six==1.17.0
          python tools/quota_guard.py --repo "$GITHUB_REPOSITORY" --need "$((BUDGET + 30))" | tee guard.txt
          if grep -q "Quota paused" guard.txt; then echo "SKIP=true" >> "$GITHUB_ENV"; exit 0; fi
          # Any running kernel of the account (also another project's) keeps the GPU busy.
          running=$(python tools/kaggle_busy.py | tr '\n' ' ')
          if [ -n "$running" ]; then
            echo "SKIP=true" >> "$GITHUB_ENV"
            echo "GPU busy ($running); Collect or the next push starts this run later." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push the training job to Kaggle
        if: env.SKIP != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          kid=$(python tools/kaggle_job.py --dir job --owner "$KAGGLE_USERNAME" \
                  --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --base "$BASE" --name "$NAME" \
                  --epochs "$EPOCHS" --sweep "$SWEEP" --budget "$BUDGET" --batch "$BATCH" --grad-accum "$ACCUM")
          # Kernel limit: budget plus 1 h for setup and export, below Kaggle's 12 h.
          kaggle kernels push -p job --accelerator NvidiaTeslaT4 --timeout "$(( (BUDGET + 60) * 60 ))"
          echo "Started $kid for $NAME; Collect publishes the result when it is done." >> "$GITHUB_STEP_SUMMARY"
