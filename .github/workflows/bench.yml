name: Benchmark

# Manual only. The model is downloaded into the runner for this job and never
# committed to the repository.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to benchmark
        type: choice
        default: qwen2.5-1.5b-instruct-q8_0
        options:
          - qwen2.5-1.5b-instruct-q8_0   # class 4GB
          - qwen2.5-7b-instruct-q4_k_m   # class 8GB
          - qwen2.5-1.5b-instruct-q4_k_m
      mode:
        description: "generate: JSON under the grammar · classify: intent by letter logits · route: only the intent branches"
        type: choice
        default: generate
        options:
          - generate
          - classify
          - route
      adapter:
        description: "Optional: release tag of this repository with one LoRA adapter (*.gguf); empty = base model only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ inputs.model }}-${{ inputs.mode }}-${{ inputs.adapter }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU build)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements.txt

      - name: CPU features of the build
        run: |
          grep -m1 'model name' /proc/cpuinfo
          python -c "import llama_cpp; print(llama_cpp.llama_print_system_info().decode())"

      - name: Grammar check and dry run
        run: python runner/bench.py --dry-run --mode "${{ inputs.mode }}" > /dev/null

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: model-${{ inputs.model }}

      # Fixed Hugging Face commit and SHA-256 per file (models.json); stops on any mismatch.
      - name: Download the pinned model
        id: model
        env:
          # Only used if Hugging Face fails: private Kaggle mirror (mirror.yml).
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          MODEL: ${{ inputs.model }}
        run: python tools/fetch_model.py "$MODEL" --dir models

      - name: Download adapter
        id: adapter
        if: inputs.adapter != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.adapter }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.gguf' --dir adapters
          files=(adapters/*.gguf)
          test "${#files[@]}" -eq 1 || { echo "release $TAG must contain exactly one .gguf" >&2; exit 1; }
          sha256sum "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Benchmark
        env:
          VYVY_LORA_PATH: ${{ steps.adapter.outputs.path }}
        run: |
          set -euo pipefail
          python runner/bench.py \
            --model "${{ steps.model.outputs.path }}" \
            --label "${{ inputs.model }}" \
            --mode "${{ inputs.mode }}" \
            --threads "$(nproc)" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json results.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-${{ inputs.model }}-${{ inputs.mode }}${{ inputs.adapter && format('-{0}', inputs.adapter) || '' }}
          path: results.json
          retention-days: 30
