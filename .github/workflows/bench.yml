name: Benchmark

# Manual only. The model is downloaded into the runner for this job and never
# committed to the repository.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model to benchmark
        type: choice
        default: qwen2.5-1.5b-instruct-q8_0
        options:
          - qwen2.5-1.5b-instruct-q8_0   # class 4GB
          - qwen2.5-7b-instruct-q4_k_m   # class 8GB
          - qwen2.5-1.5b-instruct-q4_k_m
      mode:
        description: "generate: JSON under the grammar · classify: intent by letter logits · route: only the intent branches"
        type: choice
        default: generate
        options:
          - generate
          - classify
          - route
      adapter:
        description: "Optional: release tag of this repository with one LoRA adapter (*.gguf); empty = base model only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: bench-${{ inputs.model }}-${{ inputs.mode }}-${{ inputs.adapter }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU build)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements.txt

      - name: CPU features of the build
        run: |
          grep -m1 'model name' /proc/cpuinfo
          python -c "import llama_cpp; print(llama_cpp.llama_print_system_info().decode())"

      - name: Grammar check and dry run
        run: python runner/bench.py --dry-run --mode "${{ inputs.mode }}" > /dev/null

      - name: Resolve model
        id: model
        run: |
          set -euo pipefail
          m="${{ inputs.model }}"
          # Split models are loaded through their first shard; llama.cpp finds the rest.
          case "$m" in
            qwen2.5-1.5b-instruct-q4_k_m|qwen2.5-1.5b-instruct-q8_0)
                                          repo=Qwen/Qwen2.5-1.5B-Instruct-GGUF; file="$m.gguf" ;;
            qwen2.5-7b-instruct-q4_k_m)   repo=Qwen/Qwen2.5-7B-Instruct-GGUF; file="$m-00001-of-00002.gguf" ;;
            *) echo "unknown model" >&2; exit 1 ;;
          esac
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models
          key: model-${{ inputs.model }}

      - name: Download model
        run: |
          set -euo pipefail
          test -f "models/${{ steps.model.outputs.file }}" || python -c "
          from huggingface_hub import snapshot_download
          snapshot_download('${{ steps.model.outputs.repo }}', allow_patterns=['${{ inputs.model }}*.gguf'], local_dir='models')
          "
          sha256sum models/${{ inputs.model }}*.gguf

      - name: Download adapter
        id: adapter
        if: inputs.adapter != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.adapter }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.gguf' --dir adapters
          files=(adapters/*.gguf)
          test "${#files[@]}" -eq 1 || { echo "release $TAG must contain exactly one .gguf" >&2; exit 1; }
          sha256sum "${files[0]}"
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Benchmark
        env:
          VYVY_LORA_PATH: ${{ steps.adapter.outputs.path }}
        run: |
          set -euo pipefail
          python runner/bench.py \
            --model "models/${{ steps.model.outputs.file }}" \
            --label "${{ inputs.model }}" \
            --mode "${{ inputs.mode }}" \
            --threads "$(nproc)" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json results.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results-${{ inputs.model }}-${{ inputs.mode }}${{ inputs.adapter && format('-{0}', inputs.adapter) || '' }}
          path: results.json
          retention-days: 30
