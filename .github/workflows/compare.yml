name: Compare

# Every variant runs in this one job, one after the other, on the same runner.
# Only then are the milliseconds comparable. Starts by itself when the runner,
# the grammar, the holdout set or the dependencies change on main.
on:
  push:
    branches: [main]
    paths:
      - "runner/**"
      - "grammars/**"
      - "data/holdout_benchmarks.json"
      - "requirements.txt"
      - ".github/workflows/compare.yml"
  workflow_dispatch:
    inputs:
      reference_sample:
        description: Questions for the 7B generate reference, spread evenly (0 = all 60)
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: compare
  cancel-in-progress: false

env:
  M_SMALL: qwen2.5-1.5b-instruct-q8_0
  M_LARGE: qwen2.5-7b-instruct-q4_k_m

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU build)
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements.txt

      - name: CPU features of the build
        run: |
          grep -m1 'model name' /proc/cpuinfo
          python -c "import llama_cpp; print(llama_cpp.llama_print_system_info().decode())"

      # One cache for the pair: two cache steps on the same folder would each save both models.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: models-compare-${{ env.M_SMALL }}-${{ env.M_LARGE }}

      # Fixed Hugging Face commits and SHA-256 per file (models.json).
      - name: Download the pinned models
        env:
          # Only used if Hugging Face fails: private Kaggle mirror (mirror.yml).
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          python tools/fetch_model.py "$M_SMALL" --dir models
          python tools/fetch_model.py "$M_LARGE" --dir models

      - name: 1/3 Class 4GB, 1.5B, route
        run: |
          python runner/bench.py --model "models/$M_SMALL.gguf" --label "$M_SMALL" --mode route \
            --threads "$(nproc)" --summary "$GITHUB_STEP_SUMMARY" --json results-1-small-route.json

      - name: 2/3 Class 8GB, 7B, route
        run: |
          python runner/bench.py --model "models/$M_LARGE-00001-of-00002.gguf" --label "$M_LARGE" --mode route \
            --threads "$(nproc)" --summary "$GITHUB_STEP_SUMMARY" --json results-2-large-route.json

      - name: 3/3 Reference, 7B, generate
        env:
          REFERENCE_SAMPLE: ${{ inputs.reference_sample || 20 }}
        run: |
          python runner/bench.py --model "models/$M_LARGE-00001-of-00002.gguf" --label "$M_LARGE" --mode generate \
            --sample "$REFERENCE_SAMPLE" \
            --threads "$(nproc)" --summary "$GITHUB_STEP_SUMMARY" --json results-3-large-generate.json

      - name: Comparison table
        run: python tools/compare_results.py results-*.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compare-results
          path: results-*.json
          retention-days: 30
