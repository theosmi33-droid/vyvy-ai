name: Mirror

# Keeps a private copy of every pinned model file as the Kaggle dataset
# <KAGGLE_USERNAME>/vyvy-model-mirror, so the benchmark does not depend on
# Hugging Face alone. Files are downloaded from the pinned commits, verified
# against models.json, then uploaded; tools/fetch_model.py uses the mirror only
# when Hugging Face fails and checks the same SHA-256.
on:
  push:
    branches: [main]
    paths: ["models.json", ".github/workflows/mirror.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: kaggle
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download and verify every pinned model
        run: |
          set -euo pipefail
          pip install -q huggingface_hub==0.36.2 kaggle==2.2.5 six==1.17.0
          df -h . | tail -1
          for m in $(python -c "import json; print(' '.join(json.load(open('models.json'))['gguf']))"); do
            python tools/fetch_model.py "$m" --dir mirror
          done
          cp models.json mirror/
          ls -la mirror

      - name: Upload to the private Kaggle dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          meta = {"title": "vyvy-model-mirror", "id": f"{os.environ['KAGGLE_USERNAME']}/vyvy-model-mirror",
                  "licenses": [{"name": "apache-2.0"}],
                  "subtitle": "Pinned copies of the base models used by the Vyvy AI benchmark"}
          json.dump(meta, open("mirror/dataset-metadata.json", "w"), indent=1)
          PY
          if kaggle datasets status "$KAGGLE_USERNAME/vyvy-model-mirror" >/dev/null 2>&1; then
            kaggle datasets version -p mirror -m "models.json at $GITHUB_SHA" --dir-mode skip
          else
            kaggle datasets create -p mirror --dir-mode skip
          fi
          echo "Mirror updated from models.json at $GITHUB_SHA (private dataset)." >> "$GITHUB_STEP_SUMMARY"
