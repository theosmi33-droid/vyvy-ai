name: Data check

# Training data must never contain holdout questions or near copies.
on:
  push:
    paths: ["data/**", "tools/check_holdout_leak.py"]
  pull_request:
    paths: ["data/**", "tools/check_holdout_leak.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Holdout lock
        run: python tools/check_holdout_leak.py
