name: Data check

# Training data must never contain holdout questions or near copies: the lock
# compares characters and words; the semantic check lists paraphrases.
on:
  push:
    paths: ["data/**", "training/synthesize.py", "tools/check_holdout_leak.py", "tools/check_semantic_leak.py", "tools/semantic-requirements.txt", "tools/import_partner.py"]
  pull_request:
    paths: ["data/**", "training/synthesize.py", "tools/check_holdout_leak.py", "tools/check_semantic_leak.py", "tools/semantic-requirements.txt", "tools/import_partner.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/semantic-requirements.txt
      - name: Holdout lock
        run: python tools/check_holdout_leak.py
      - name: No personal data in partner files
        run: python tools/import_partner.py --check
      - name: Semantic check (paraphrases of holdout sentences)
        if: always()
        run: |
          pip install -q -r tools/semantic-requirements.txt
          python tools/check_semantic_leak.py --show 0 --summary "$GITHUB_STEP_SUMMARY"
