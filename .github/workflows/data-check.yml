name: Data check

# Training data must never contain holdout questions or near copies.
on:
  push:
    paths: ["data/**", "tools/check_holdout_leak.py"]
  pull_request:
    paths: ["data/**", "tools/check_holdout_leak.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  holdout-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Holdout lock
        run: python tools/check_holdout_leak.py
